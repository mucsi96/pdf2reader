[project]
name = "pdf2reader"
version = "0.1.0"
description = "Convert local PDFs to Markdown and EPUB using OpenAI"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "openai>=3.50.0",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
pdf2reader = "pdf2reader:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
